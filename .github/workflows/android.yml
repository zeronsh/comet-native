name: android

on:
  pull_request:
    paths: ["apps/android/**", "crates/zeron-loro-android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["apps/android/**", "crates/zeron-loro-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26d }
      - uses: gradle/actions/setup-gradle@v3
      - name: Build native Loro lib (arm64)
        run: |
          cargo install cargo-ndk --locked || true
          cargo ndk -t arm64-v8a -o apps/android/app/src/main/jniLibs build --release -p zeron-loro-android
      - name: Build arm64 release APK
        run: |
          ls apps/android/app/src/main/jniLibs/arm64-v8a/
          cd apps/android && gradle :app:assembleRelease --stacktrace
          apk=$(ls app/build/outputs/apk/release/*.apk)
          unzip -l "$apk" | grep -E "lib/" || true
          test $(unzip -l "$apk" | grep -c "lib/arm64-v8a/libzeron_loro_android.so") -eq 1
          test $(unzip -l "$apk" | grep -c "lib/x86") -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: zeron-android-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
